<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domain Sync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="actions">
          <button id="refresh-btn" class="primary-btn">Refresh domains</button>
          <span id="status" class="status">Starting...</span>
        </div>
        <p id="provider-status" class="provider-status"></p>
      </section>

      <section class="table-shell">
        <div class="table-wrap">
          <table class="domains-table">
            <thead>
              <tr>
                <th><button class="sort-trigger" type="button" data-sort="name">Domains</button></th>
                <th><button class="sort-trigger" type="button" data-sort="purchase">Purchase</button></th>
                <th><button class="sort-trigger" type="button" data-sort="expiry">Expires on</button></th>
                <th><button class="sort-trigger" type="button" data-sort="daysRemaining">Days Remaining</button></th>
                <th><button class="sort-trigger" type="button" data-sort="registrar">Registrar</button></th>
                <th><button class="sort-trigger" type="button" data-sort="boughtOn">Bought on</button></th>
                <th><button class="sort-trigger" type="button" data-sort="holding">Holding</button></th>
              </tr>
            </thead>
            <tbody id="domains-table-body"></tbody>
          </table>
        </div>
      </section>

      <section class="table-shell removed-shell">
        <details id="removed-domains-details">
          <summary class="removed-summary">
            <span>Recently removed domains</span>
            <span id="removed-count" class="removed-count">0</span>
          </summary>
          <div class="table-wrap removed-wrap">
            <table class="domains-table removed-table">
              <thead>
                <tr>
                  <th>Domain</th>
                  <th>Registrar</th>
                  <th>Removed at</th>
                </tr>
              </thead>
              <tbody id="removed-domains-table-body"></tbody>
            </table>
          </div>
        </details>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
